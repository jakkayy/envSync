version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: envsync
    main: ./cmd/envsync
    binary: envsync
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/jakkayy/envSync/internal/cli.Version={{.Version}} -X github.com/jakkayy/envSync/internal/cli.Commit={{.Commit}} -X github.com/jakkayy/envSync/internal/cli.Date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
